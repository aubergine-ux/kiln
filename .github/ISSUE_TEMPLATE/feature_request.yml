name: Feature request
description: An idea for something Kiln could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: Anything you're doing now instead.
